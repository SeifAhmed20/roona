<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>♡</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------- Theme ---------- */
      :root {
        --ink: #6b4a7a;
        --pink: #ff8fb8;
        --lav: #d9c8ff;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: "Cairo", system-ui, sans-serif;
        color: var(--ink);
        overflow-x: hidden;
        overflow-y: auto;
        background: linear-gradient(
            180deg,
            #ffe3ef 0%,
            #ecdcff 50%,
            #ffe3ef 100%
          )
          fixed;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: safe center;
        gap: 36px;
        padding: calc(80px + var(--safe-t)) 16px calc(28px + var(--safe-b));
      }
      svg {
        display: block;
        image-rendering: pixelated;
      }

      /* floating pixel decorations */
      #bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #bg .deco {
        position: absolute;
        bottom: -40px;
        opacity: 0.55;
        animation: rise linear infinite;
      }
      @keyframes rise {
        to {
          transform: translateY(-115vh) rotate(25deg);
        }
      }
      @keyframes bob {
        50% {
          transform: translateY(-10px);
        }
      }

      /* ---------- Envelope (centered) ---------- */
      #env {
        position: relative;
        display: block;
        width: min(310px, 84vw);
        height: 190px;
        padding: 0;
        cursor: pointer;
        z-index: 2;
        background: #f59cc0;
        border: 4px solid var(--ink);
        border-radius: 8px;
        box-shadow: 6px 6px 0 var(--ink);
        animation: bob 2s ease-in-out infinite;
      }
      #env.open {
        animation: none;
      }
      #env .flap,
      #env .pocket {
        position: absolute;
        left: 0;
        right: 0;
      }
      #env .flap {
        top: 0;
        height: 55%;
        background: #ffa9cb;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: top;
        transition:
          transform 0.6s ease,
          z-index 0s 0.3s;
        z-index: 4;
      }
      #env .pocket {
        top: 0;
        bottom: 0;
        background: #ffc6dd;
        clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
        z-index: 3;
      }
      #env .seal {
        position: absolute;
        left: 50%;
        top: 55%;
        width: 34px;
        margin: -17px 0 0 -17px;
        z-index: 5;
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      #env.open .flap {
        transform: rotateX(180deg);
        z-index: 1;
      }
      #env.open .seal {
        opacity: 0;
        transform: scale(0);
      }
      /* small paper that slides out of the envelope */
      .paper {
        position: absolute;
        left: 5%;
        right: 5%;
        top: 8px;
        height: 170px;
        z-index: 2;
        background: #fffaf0
          repeating-linear-gradient(0deg, transparent 0 31px, #f1e3ee 31px 33px);
        border: 3px solid var(--ink);
        border-radius: 6px;
        transition: transform 0.9s 0.35s cubic-bezier(0.3, 1.2, 0.5, 1);
      }
      #env.open .paper {
        transform: translateY(-70px);
      }

      /* ---------- Unlock form ---------- */
      .gate {
        position: relative;
        z-index: 2;
        width: min(310px, 84vw);
        display: flex;
        flex-direction: column;
        gap: 12px;
        direction: ltr;
        text-align: left;
        background: rgba(255, 255, 255, 0.75);
        border: 4px solid var(--ink);
        border-radius: 8px;
        padding: 16px;
        box-shadow: 6px 6px 0 var(--ink);
        transition:
          opacity 0.6s,
          transform 0.6s,
          visibility 0.6s;
      }
      .gate.hide {
        opacity: 0;
        visibility: hidden;
        transform: translateY(14px);
      }
      .gate label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-weight: 700;
        font-size: 15px;
      }
      .gate input {
        font:
          600 17px "Cairo",
          sans-serif;
        padding: 8px 12px;
        color: var(--ink);
        min-width: 0;
        border: 4px solid var(--ink);
        border-radius: 8px;
        background: #fff;
        outline: none;
      }
      .gate input:focus {
        box-shadow: 0 0 0 4px var(--lav);
      }
      .btn {
        font:
          700 18px "Cairo",
          sans-serif;
        color: #fff;
        background: var(--pink);
        border: 4px solid var(--ink);
        border-radius: 8px;
        padding: 8px 22px;
        cursor: pointer;
        box-shadow: 0 5px 0 var(--ink);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 var(--ink);
      }
      #gMsg {
        min-height: 22px;
        font-weight: 700;
        font-size: 15px;
        text-align: center;
        color: #d9457c;
      }
      .shake,
      #env.nope {
        animation: shake 0.4s;
      }
      @keyframes shake {
        25% {
          transform: translateX(-8px);
        }
        75% {
          transform: translateX(8px);
        }
      }

      /* ---------- Letter reader (big, readable) ---------- */
      #reader {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 18px;
        background: rgba(255, 227, 239, 0.85);
        backdrop-filter: blur(3px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s;
      }
      #reader.show {
        opacity: 1;
        pointer-events: auto;
      }
      .reader-in {
        position: relative;
        width: min(460px, 100%);
        transform: scale(0.8) translateY(40px);
        transition: transform 0.6s cubic-bezier(0.3, 1.4, 0.5, 1);
      }
      #reader.show .reader-in {
        transform: none;
      }
      .card {
        --lh: 36px;
        max-height: calc(100svh - 90px);
        overflow-y: auto;
        direction: rtl;
        text-align: right;
        padding: 34px 22px 22px;
        border: 4px solid var(--ink);
        border-radius: 8px;
        box-shadow: 6px 6px 0 var(--ink);
        background: #fffaf0
          repeating-linear-gradient(
            0deg,
            transparent 0 calc(var(--lh) - 2px),
            #f1e3ee calc(var(--lh) - 2px) var(--lh)
          );
        background-attachment: local;
      }
      .card p {
        margin: 0;
        font-weight: 700;
        font-size: 18px;
        line-height: var(--lh);
      }
      @media (max-width: 380px) {
        .card {
          --lh: 33px;
        }
        .card p {
          font-size: 16.5px;
        }
      }
      #close {
        position: absolute;
        top: -16px;
        left: -8px;
        z-index: 3;
        width: 42px;
        height: 42px;
        padding: 0;
        cursor: pointer;
        font:
          900 20px "Cairo",
          sans-serif;
        color: #fff;
        background: var(--pink);
        border: 4px solid var(--ink);
        border-radius: 8px;
        box-shadow: 0 4px 0 var(--ink);
      }
      #close:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--ink);
      }

      .burst {
        position: fixed;
        z-index: 30;
        pointer-events: none;
        animation: burst 0.7s ease-out forwards;
      }
      @keyframes burst {
        to {
          transform: translate(var(--dx), var(--dy)) scale(0);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          transition-duration: 0.01s !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="bg" aria-hidden="true"></div>

    <button id="env" aria-label="envelope">
      <div class="paper"></div>
      <div class="flap"></div>
      <div class="pocket"></div>
      <div class="seal" id="seal"></div>
    </button>

    <form class="gate" id="gate" autocomplete="off">
      <label>Your name<input id="gName" dir="auto" maxlength="30" /></label>
      <label
        >When did we first know each other -date-?<input
          id="gDate"
          maxlength="20"
          inputmode="text"
      /></label>
      <button class="btn" type="submit">Unlock</button>
      <div id="gMsg"></div>
    </form>

    <div id="reader">
      <div class="reader-in">
        <button id="close" aria-label="close">✕</button>
        <div class="card"><p id="msg"></p></div>
      </div>
    </div>

    <script>
      /* ---------- Pixel-art helpers ---------- */
      function px(grid, pal) {
        let r = "";
        grid.forEach((row, y) =>
          [...row].forEach((c, x) => {
            if (pal[c])
              r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[c]}"/>`;
          }),
        );
        return `<svg viewBox="0 0 ${grid[0].length} ${grid.length}" shape-rendering="crispEdges" width="100%">${r}</svg>`;
      }
      const HEART = [
        ".hh.hh.",
        "hwhhhhh",
        "hhhhhhh",
        ".hhhhh.",
        "..hhh..",
        "...h...",
      ];
      const SPARK = ["..s..", "..s..", "sssss", "..s..", "..s.."];
      const COLORS = ["#ff5c93", "#ff8fb8", "#b79cf5", "#ffb3d1", "#ffd36e"];
      const rnd = (a, b) => a + Math.random() * (b - a);
      const pick = (a) => a[Math.floor(Math.random() * a.length)];
      const heartSVG = (c) => px(HEART, { h: c, w: "#fff" });
      const $ = (id) => document.getElementById(id);

      /* ---------- Background decorations + seal ---------- */
      for (let i = 0; i < 18; i++) {
        const d = document.createElement("div"),
          c = pick(COLORS),
          s = rnd(14, 30);
        d.className = "deco";
        d.style.cssText = `left:${rnd(0, 98)}%;width:${s}px;animation-duration:${rnd(12, 26)}s;animation-delay:${-rnd(0, 26)}s`;
        d.innerHTML = Math.random() < 0.55 ? heartSVG(c) : px(SPARK, { s: c });
        $("bg").appendChild(d);
      }
      $("seal").innerHTML = heartSVG("#ff4d88");

      function burst(x, y, n = 10) {
        for (let i = 0; i < n; i++) {
          const b = document.createElement("div"),
            a = (i / n) * Math.PI * 2,
            d = rnd(40, 80);
          b.className = "burst";
          b.style.cssText = `left:${x - 9}px;top:${y - 9}px;width:18px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`;
          b.innerHTML = px(SPARK, { s: pick(COLORS) });
          document.body.appendChild(b);
          b.addEventListener("animationend", () => b.remove());
        }
      }

      /* ---------- Envelope: open, then show the letter ---------- */
      // The letter text is only put on the page after the unlock succeeds
      const LETTER =
        "انا كنت هقولك اني دايما بحبك ودايما عاوز اشوفك و مش عايش حياتي وانتي زعلانه ولا حاجه انتي ف بالي دايما و طول ما انا مزعلك اقسم بالله بكون مش طايق نفسي بس انتي قولتي متقرفنيش و حاجات كدا فا مقولتش حاجه , لو دخلتي هنا بعدين ولا حاجه اعرفي اني دايما حابب اصلح هي بس مقرف دي اللي عصبتني شويه , هسيب البتاع دا شغال وهنساه مش هوقفه";
      let unlocked = false;

      // Accepted names (compared lowercase, spaces removed)
      const NAMES = ["rawan", "روان", "رافان", "رونا"];
      function nameOK(v) {
        return NAMES.includes(v.trim().toLowerCase().replace(/\s+/g, ""));
      }
      // Accepted date: 4/5/2020 (also 04-05-2020, 4.5.2020, Arabic digits)
      function dateOK(v) {
        v = v.replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
        const p = v
          .trim()
          .split(/[\/\-.\s]+/)
          .map(Number);
        return p.length === 3 && p[0] === 4 && p[1] === 5 && p[2] === 2020;
      }

      function openEnvelope(x, y) {
        $("env").classList.add("open");
        burst(x, y);
        setTimeout(() => $("reader").classList.add("show"), 1300);
      }

      $("gate").onsubmit = (e) => {
        e.preventDefault();
        if (nameOK($("gName").value) && dateOK($("gDate").value)) {
          unlocked = true;
          $("msg").textContent = LETTER;
          $("gate").classList.add("hide");
          $("gMsg").textContent = "";
          const r = $("env").getBoundingClientRect();
          openEnvelope(r.left + r.width / 2, r.top + r.height / 2);
        } else {
          $("gMsg").textContent = "Hmm, try again \uD83D\uDE48";
          $("gate").classList.remove("shake");
          void $("gate").offsetWidth;
          $("gate").classList.add("shake");
        }
      };

      $("env").onclick = (e) => {
        const env = $("env");
        if (!unlocked) {
          // locked: wiggle and point to the form
          env.classList.add("nope");
          env.addEventListener(
            "animationend",
            () => env.classList.remove("nope"),
            { once: true },
          );
          $("gName").focus();
          return;
        }
        if (env.classList.contains("open")) {
          $("reader").classList.add("show");
          return;
        } // re-open letter
        openEnvelope(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2);
      };
      const closeReader = () => $("reader").classList.remove("show");
      $("close").onclick = closeReader;
      $("reader").addEventListener("click", (e) => {
        if (e.target === $("reader")) closeReader();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeReader();
      });
    </script>
  </body>
</html>
